workflows:
  android-release:
    name: Android Release
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - google_play
      vars:
        PACKAGE_NAME: "com.donatequran.donate_quran"
        SUPABASE_URL: $SUPABASE_URL
        SUPABASE_ANON_KEY: $SUPABASE_ANON_KEY
        REVENUECAT_API_KEY_ANDROID: $REVENUECAT_API_KEY_ANDROID
        STRIPE_PUBLISHABLE_KEY: $STRIPE_PUBLISHABLE_KEY
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Create env file
        script: |
          cat > .env <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          REVENUECAT_API_KEY_ANDROID=$REVENUECAT_API_KEY_ANDROID
          REVENUECAT_API_KEY_IOS=$REVENUECAT_API_KEY_IOS
          STRIPE_PUBLISHABLE_KEY=$STRIPE_PUBLISHABLE_KEY
          EOF
      - name: Analyze and test
        script: |
          flutter analyze
          flutter test
      - name: Build AAB
        script: flutter build appbundle --release --dart-define-from-file=.env
    artifacts:
      - build/app/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal

  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      # Must match the App Store Connect API key name in Codemagic → Team integrations.
      app_store_connect: app_store_credentials
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.donatequran.donatequran
      groups:
        - app_store_credentials
      vars:
        BUNDLE_ID: "com.donatequran.donatequran"
        SUPABASE_URL: $SUPABASE_URL
        SUPABASE_ANON_KEY: $SUPABASE_ANON_KEY
        REVENUECAT_API_KEY_IOS: $REVENUECAT_API_KEY_IOS
        STRIPE_PUBLISHABLE_KEY: $STRIPE_PUBLISHABLE_KEY
        # Optional: set in Codemagic to auto-bump CFBundleVersion from ASC.
        # APP_STORE_APPLE_ID: "1234567890"
    scripts:
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Get packages
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: find . -name "Podfile" -execdir pod install \;
      - name: Create env file
        script: |
          cat > .env <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          REVENUECAT_API_KEY_IOS=$REVENUECAT_API_KEY_IOS
          STRIPE_PUBLISHABLE_KEY=$STRIPE_PUBLISHABLE_KEY
          EOF
      - name: Analyze and test
        script: |
          flutter analyze
          flutter test
      - name: Build IPA
        script: |
          BUILD_NUMBER_ARGS=()
          if [ -n "${APP_STORE_APPLE_ID:-}" ]; then
            BUILD_NUMBER_ARGS+=(--build-number=$(($(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID") + 1)))
          fi
          flutter build ipa --release \
            --dart-define-from-file=.env \
            --export-options-plist=/Users/builder/export_options.plist \
            "${BUILD_NUMBER_ARGS[@]}"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
