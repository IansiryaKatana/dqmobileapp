workflows:
  android-release:
    name: Android Release
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - google_play
      vars:
        PACKAGE_NAME: "com.donatequran.donate_quran"
        SUPABASE_URL: $SUPABASE_URL
        SUPABASE_ANON_KEY: $SUPABASE_ANON_KEY
        REVENUECAT_API_KEY_ANDROID: $REVENUECAT_API_KEY_ANDROID
        STRIPE_PUBLISHABLE_KEY: $STRIPE_PUBLISHABLE_KEY
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Create env file
        script: |
          cat > .env <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          REVENUECAT_API_KEY_ANDROID=$REVENUECAT_API_KEY_ANDROID
          REVENUECAT_API_KEY_IOS=$REVENUECAT_API_KEY_IOS
          STRIPE_PUBLISHABLE_KEY=$STRIPE_PUBLISHABLE_KEY
          EOF
      - name: Analyze and test
        script: |
          flutter analyze
          flutter test
      - name: Build AAB
        script: flutter build appbundle --release --dart-define-from-file=.env
    artifacts:
      - build/app/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal

  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      groups:
        - app_store_credentials
      vars:
        BUNDLE_ID: "ae.giovanni.donatequran"
        STRIPE_PUBLISHABLE_KEY: $STRIPE_PUBLISHABLE_KEY
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Create env file
        script: |
          cat > .env <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          REVENUECAT_API_KEY_IOS=$REVENUECAT_API_KEY_IOS
          STRIPE_PUBLISHABLE_KEY=$STRIPE_PUBLISHABLE_KEY
          EOF
      - name: Analyze and test
        script: |
          flutter analyze
          flutter test
      - name: Build IPA
        script: flutter build ipa --release --dart-define-from-file=.env
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
